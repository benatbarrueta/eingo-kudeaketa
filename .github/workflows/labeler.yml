name: PR labels

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-labels-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Reads configuration from the base branch; never checks out PR code.
      - uses: actions/labeler@v6
        with:
          sync-labels: true
